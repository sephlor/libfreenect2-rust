[package]
name = "libfreenect2-rust"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["cuda"]
cuda = ["dep:baracuda-driver", "dep:baracuda-nvjpeg", "dep:cuda-async", "dep:cuda-core"]

[dependencies]
baracuda-driver = { version = "0.1.0-alpha.148", optional = true }
baracuda-nvjpeg = { version = "0.1.0-alpha.148", optional = true }
cuda-async = { git = "https://github.com/sephlor/cuda-rust.git", branch = "new_mem_pool_with_params", optional = true }
cuda-core = { git = "https://github.com/sephlor/cuda-rust.git", branch = "new_mem_pool_with_params", optional = true }
log = "0.4.35"
nusb = "0.2"
thiserror = "2.0.21"
zune-jpeg = "0.5.15"

[dev-dependencies]
env_logger = "0.11.11"
glow = "0.18.0"
glutin = "0.32.3"
glutin-winit = "0.5"
winit = "0.30"
