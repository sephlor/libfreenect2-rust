name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --check

  build-test-no-default-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all targets
        run: cargo build --locked --no-default-features --all-targets

      - name: Test
        run: cargo test --locked --no-default-features

      - name: Clippy
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings

  build-default-features:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: nvidia/cuda:13.0.2-devel-ubuntu24.04
    env:
      CUDA_HOME: /usr/local/cuda
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libclang-dev pkg-config

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build all targets
        run: cargo build --locked --all-targets
